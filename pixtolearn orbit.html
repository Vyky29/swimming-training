<script>
  (function(){
    const section = document.getElementById("pixtoOrbitSection");
    const block = document.getElementById("pxlOrbitBlock");
    const buttons = Array.from(document.querySelectorAll("#pixtoOrbitSection .orbit-item"));
    const tablist = section && section.querySelector('[role="tablist"]');
    const card = document.getElementById("orbitCard");
    const cardIconHolder = document.getElementById("cardIconHolder");
    const cardTitle = document.getElementById("cardTitle");
    const cardText = document.getElementById("cardText");

    const reducedMotion = typeof matchMedia !== "undefined" &&
      matchMedia("(prefers-reduced-motion: reduce)").matches;

    function cloneIcon(templateId){
      const tpl = document.getElementById(templateId);
      if (!tpl) return null;
      return tpl.content.firstElementChild.cloneNode(true);
    }

    function mountNodeIcons(){
      buttons.forEach(btn => {
        const inner = btn.querySelector(".orbit-item-inner");
        const iconId = btn.getAttribute("data-icon");
        const node = cloneIcon(iconId);
        if (inner && node){
          inner.innerHTML = "";
          inner.appendChild(node);
        }
      });
    }

    function fitBlock(el, basePx, minPx, lines){
      if (!el) return;
      el.style.fontSize = basePx + "px";

      const style = getComputedStyle(el);
      const lineHeight = parseFloat(style.lineHeight) || (1.2 * basePx);
      const maxHeight = Math.ceil(lineHeight * lines);

      let size = basePx;
      while (size > minPx && el.scrollHeight > maxHeight + 1){
        size -= 1;
        el.style.fontSize = size + "px";
      }
    }

    function applyFit(){
      const root = getComputedStyle(document.documentElement);

      const titleBase = parseInt(root.getPropertyValue("--title-base"), 10) || 22;
      const titleMin = parseInt(root.getPropertyValue("--title-min"), 10) || 14;
      const titleLines = parseInt(root.getPropertyValue("--title-lines"), 10) || 2;

      const textBase = parseInt(root.getPropertyValue("--text-base"), 10) || 17;
      const textMin = parseInt(root.getPropertyValue("--text-min"), 10) || 14;
      const textLines = parseInt(root.getPropertyValue("--text-lines"), 10) || 4;

      fitBlock(cardTitle, titleBase, titleMin, titleLines);
      fitBlock(cardText, textBase, textMin, textLines);
    }

    function setTabState(i){
      buttons.forEach((b, idx) => {
        const on = idx === i;
        b.classList.toggle("is-active", on);
        b.setAttribute("aria-selected", on ? "true" : "false");
        b.setAttribute("tabindex", on ? "0" : "-1");
      });
      if (card && buttons[i]){
        card.setAttribute("aria-labelledby", buttons[i].id);
      }
    }

    const CARD_TRANSITION_MS = 320;
    const AUTO_ROTATE_MS = 4000;
    const RESUME_IDLE_MS = 8000;

    let index = 0;
    let timer = null;
    let resumeTimer = null;

    function clearAuto(){
      if (timer){
        clearInterval(timer);
        timer = null;
      }
    }

    function clearResume(){
      if (resumeTimer){
        clearTimeout(resumeTimer);
        resumeTimer = null;
      }
    }

    function updateCardFrom(btn){
      cardIconHolder.style.opacity = 0;
      cardTitle.style.opacity = 0;
      cardText.style.opacity = 0;

      setTimeout(() => {
        const iconId = btn.getAttribute("data-icon");
        const node = cloneIcon(iconId);
        if (node){
          cardIconHolder.innerHTML = "";
          cardIconHolder.appendChild(node);
        }

        cardTitle.textContent = (btn.getAttribute("data-title") || "").toUpperCase();
        cardText.textContent = btn.getAttribute("data-text") || "";

        applyFit();

        requestAnimationFrame(() => {
          cardIconHolder.style.opacity = 1;
          cardTitle.style.opacity = 1;
          cardText.style.opacity = 1;
        });
      }, CARD_TRANSITION_MS);
    }

    function show(i){
      index = i;
      setTabState(i);
      updateCardFrom(buttons[i]);
      card.classList.add("is-active");
    }

    function startAuto(){
      clearAuto();
      if (reducedMotion) return;
      timer = setInterval(() => {
        show((index + 1) % buttons.length);
      }, AUTO_ROTATE_MS);
    }

    function scheduleResumeAuto(){
      clearResume();
      if (reducedMotion) return;
      resumeTimer = setTimeout(() => {
        resumeTimer = null;
        if (block) block.classList.remove("pxl-orbit-tap-hold");
        startAuto();
      }, RESUME_IDLE_MS);
    }

    /** User chose a tab: pause orbit + slideshow, resume both after idle. */
    function armIdleResume(){
      if (block && !reducedMotion) block.classList.add("pxl-orbit-tap-hold");
      clearAuto();
      scheduleResumeAuto();
    }

    function onTabActivate(i, opts){
      const fromKeyboard = opts && opts.fromKeyboard;
      armIdleResume();
      show(i);
      if (fromKeyboard && buttons[i]) buttons[i].focus();
    }

    if (tablist){
      tablist.addEventListener("keydown", (e) => {
        const key = e.key;
        if (key !== "ArrowRight" && key !== "ArrowLeft" && key !== "Home" && key !== "End") return;
        e.preventDefault();
        const n = buttons.length;
        if (!n) return;
        let next = index;
        if (key === "Home") next = 0;
        else if (key === "End") next = n - 1;
        else if (key === "ArrowRight") next = (index + 1) % n;
        else next = (index - 1 + n) % n;
        onTabActivate(next, { fromKeyboard:true });
      });
    }

    function init(){
      if (!buttons.length) return;
      mountNodeIcons();
      show(0);
      if (!reducedMotion) startAuto();
      window.addEventListener("resize", applyFit, { passive:true });
      if (typeof ResizeObserver !== "undefined" && card){
        const ro = new ResizeObserver(() => { applyFit(); });
        ro.observe(card);
      }
    }

    buttons.forEach((btn, i) => {
      btn.addEventListener("click", () => {
        onTabActivate(i);
      });
    });

    init();
  })();
</script>
