<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review Progress Infographic - Preview</title>
  <style>
    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:system-ui,sans-serif;
      background:#cfdce6;
      color:#163247;
    }
    body{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:20px 14px 36px;
    }
    .toolbar{
      width:min(980px,100%);
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 14px;
      border-radius:14px;
      background:rgba(255,255,255,.82);
      border:1px solid rgba(12,36,54,.08);
    }
    .toolbar p{
      margin:0;
      font-size:.8rem;
      font-weight:600;
      color:#4a6273;
    }
    .frame{
      width:min(980px,100%);
      background:#fff;
      border-radius:16px;
      padding:10px;
      box-shadow:0 14px 34px rgba(18,50,71,.1);
    }
    .frame img{
      display:block;
      width:100%;
      height:auto;
      border-radius:10px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <p>Cropped three-column visual (no header / footer)</p>
  </div>
  <div class="frame">
    <img src="./images/module-4/review-progress-three-columns.png" alt="Three steps to review progress: Review Stage, Review Level, and Review Development Areas" width="2200" height="761" />
  </div>
</body>
</html>
